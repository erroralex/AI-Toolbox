<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latent Library - Initializing</title>
    <style>
        :root {
            --color-bg-canvas: #0A0A0D;
            --color-text-primary: #F2F3F7;
            --color-text-secondary: #9294A3;
            --color-text-tertiary: #6F7180;
            --gradient-brand: linear-gradient(135deg, #67E0D8 0%, #9B7EF5 100%);
            --gradient-brand-text: linear-gradient(90deg, #67E0D8, #9B7EF5);
            --color-border-subtle: rgba(255, 255, 255, 0.06);
            --color-surface-2: #23252F;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--color-bg-canvas);
            background-image:
                radial-gradient(circle at 50% 40%, rgba(103, 224, 216, 0.08) 0%, transparent 60%),
                radial-gradient(circle at 50% 60%, rgba(155, 126, 245, 0.06) 0%, transparent 60%);
            color: var(--color-text-primary);
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            user-select: none;
            -webkit-app-region: drag;
            border: 1px solid var(--color-border-subtle);
            box-sizing: border-box;
            overflow: hidden;
        }

        .container {
            text-align: center;
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .logo-box {
            position: relative;
            width: 64px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 4px;
        }

        .logo-glow {
            position: absolute;
            inset: -8px;
            background: var(--gradient-brand);
            border-radius: 50%;
            filter: blur(16px);
            opacity: 0.35;
            animation: pulseGlow 2s ease-in-out infinite alternate;
        }

        .logo-svg {
            width: 56px;
            height: 56px;
            position: relative;
            z-index: 2;
        }

        h1 {
            font-size: 24px;
            margin: 0;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: var(--gradient-brand-text);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        p {
            font-size: 13px;
            color: var(--color-text-secondary);
            margin: 0 0 16px 0;
            font-weight: 500;
        }

        .loader {
            width: 160px;
            height: 4px;
            background: var(--color-surface-2);
            border-radius: 999px;
            overflow: hidden;
            position: relative;
            margin: 0 auto;
        }

        .loader::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 40%;
            background: var(--gradient-brand);
            border-radius: 999px;
            animation: loading 1.5s infinite ease-in-out alternate;
        }

        .version {
            font-family: "JetBrains Mono", monospace;
            font-size: 11px;
            color: var(--color-text-tertiary);
            margin-top: 8px;
        }

        @keyframes pulseGlow {
            0% { opacity: 0.25; transform: scale(0.95); }
            100% { opacity: 0.55; transform: scale(1.1); }
        }

        @keyframes loading {
            0% { transform: translateX(0%); }
            100% { transform: translateX(250%); }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="logo-box">
        <div class="logo-glow"></div>
        <svg class="logo-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#67E0D8"/>
                    <stop offset="100%" stop-color="#9B7EF5"/>
                </linearGradient>
            </defs>
            <rect x="4" y="4" width="192" height="192" rx="56" fill="url(#g)"/>
            <path d="M 76 56 L 76 144 L 140 144" fill="none" stroke="#06101A" stroke-opacity="0.35" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M 76 56 L 76 144 L 140 144" fill="none" stroke="#F7F8FB" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </div>
    <h1>Latent Library</h1>
    <p>Initializing Application Core...</p>
    <div class="loader"></div>
    <div class="version">v1.1.1</div>
</div>
</body>
</html>
